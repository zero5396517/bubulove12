<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>恋爱日记 - 相册详情</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-container">
      <div class="screen" role="application" aria-label="恋爱日记 - 相册详情">
        <div
          class="media-hero"
          style="
            background-image: url('https://images.unsplash.com/photo-1489515217757-5fd1be406fef?auto=format&fit=crop&w=1000&q=70');
          "
          aria-hidden="true"
        ></div>

        <div class="header header--on-media" style="position: relative">
          <a class="icon-button" href="albums-list.html" aria-label="返回相册列表">
            <span class="ico ico-back" aria-hidden="true"></span>
          </a>
          <div class="header-title">相册详情</div>
          <div class="header-action">
            <a class="icon-button" href="albums-detail.html#shareSheetModal" aria-label="分享">
              <span class="ico ico-share" aria-hidden="true"></span>
            </a>
            <a class="icon-button" href="albums-detail.html" aria-label="收藏（UI态）">
              <span class="ico ico-star" aria-hidden="true"></span>
            </a>
          </div>
        </div>

        <div class="content safe-pad-bottom content-below-hero">
          <div class="card">
            <div class="row-between" style="margin-bottom: var(--space-sm)">
              <div>
                <div style="font-weight: 950; font-size: 18px; margin-bottom: 6px">
                  甜品与电影
                </div>
                <div class="muted" style="font-size: 13px">封面已设置 · 12 张</div>
              </div>
              <div class="badge primary">收藏</div>
            </div>

            <div style="margin-top: var(--space-md)" class="row-between">
              <a class="button outline" style="flex: 1; margin-right: var(--space-md)" href="albums-detail.html" aria-label="封面设置">
                <span class="button-icon"><span class="ico ico-image"></span></span>
                设为封面
              </a>
              <a class="button ghost" style="flex: 1; margin-left: 0" href="albums-detail.html#shareSheetModal" aria-label="分享按钮">
                <span class="button-icon"><span class="ico ico-share"></span></span>
                分享
              </a>
            </div>

            <div class="muted" style="font-size: 12px; margin-top: 10px">
              分享：优先使用 Web Share API，兜底提供“复制链接”。
            </div>
          </div>

          <div class="card" aria-label="上传照片区域">
            <div class="row-between" style="margin-bottom: var(--space-md)">
              <div style="font-weight: 900">上传照片</div>
              <div class="badge">权限提示（UI态）</div>
            </div>

            <div class="row-between" style="gap: var(--space-md)">
              <a class="button ghost" style="flex: 1" href="albums-detail.html" aria-label="选择相册">
                <span class="button-icon"><span class="ico ico-library"></span></span>
                选择相册
              </a>
              <a class="button ghost" style="flex: 1" href="albums-detail.html" aria-label="拍照">
                <span class="button-icon"><span class="ico ico-camera"></span></span>
                拍照
              </a>
            </div>

            <div style="margin-top: var(--space-md); padding: var(--space-md); border-radius: var(--radius-md); background: var(--bg-screen); border: 1px solid var(--border-strong)">
              <div style="font-weight: 800; margin-bottom: 6px">如果权限被拒绝</div>
              <div class="muted" style="font-size: 13px">
                提示用户去设置开启相册/相机权限；同时提供“仅展示已上传内容”的降级方案。
              </div>
            </div>
          </div>

          <div class="card" aria-label="图片网格与拖拽排序UI">
            <div class="row-between" style="margin-bottom: var(--space-md)">
              <div style="font-weight: 900">拖拽排序（长按）</div>
              <div class="muted" style="font-size: 13px">示例态</div>
            </div>

            <div class="img-grid">
              <a
                class="img-tile"
                href="albums-detail.html#albumImgPreview"
                aria-label="预览照片1（封面态示例）"
              >
                <img
                  src="https://images.unsplash.com/photo-1489515217757-5fd1be406fef?auto=format&fit=crop&w=800&q=70"
                  alt="照片1"
                />
                <div class="count-badge">封面</div>
                <div
                  style="
                    position: absolute;
                    right: 8px;
                    top: 8px;
                    width: 36px;
                    height: 36px;
                    border-radius: var(--radius-full);
                    background: rgba(0, 0, 0, 0.45);
                    border: 1px solid rgba(255, 255, 255, 0.18);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                  "
                  aria-hidden="true"
                >
                  <span class="ico ico-grip ico--sm ico--on-dark" aria-hidden="true"></span>
                </div>
              </a>
              <a class="img-tile" href="albums-detail.html#albumImgPreview" aria-label="预览照片2">
                <img
                  src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=70"
                  alt="照片2"
                />
                <div
                  style="
                    position: absolute;
                    right: 8px;
                    top: 8px;
                    width: 36px;
                    height: 36px;
                    border-radius: var(--radius-full);
                    background: rgba(0, 0, 0, 0.45);
                    border: 1px solid rgba(255, 255, 255, 0.18);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                  "
                  aria-hidden="true"
                >
                  <span class="ico ico-grip ico--sm ico--on-dark" aria-hidden="true"></span>
                </div>
              </a>
              <a class="img-tile" href="albums-detail.html#albumImgPreview" aria-label="预览照片3">
                <img
                  src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=800&q=70"
                  alt="照片3"
                />
                <div
                  style="
                    position: absolute;
                    right: 8px;
                    top: 8px;
                    width: 36px;
                    height: 36px;
                    border-radius: var(--radius-full);
                    background: rgba(0, 0, 0, 0.45);
                    border: 1px solid rgba(255, 255, 255, 0.18);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                  "
                  aria-hidden="true"
                >
                  <span class="ico ico-grip ico--sm ico--on-dark" aria-hidden="true"></span>
                </div>
              </a>
            </div>

            <div class="muted" style="font-size: 12px; margin-top: var(--space-sm)">
              UI说明：长按图片进入拖拽态；拖拽占位用虚线边框/透明蒙层提示（此处为示例）。
            </div>
          </div>

          <div style="height: 24px"></div>

          <a class="button ghost full" href="albums-list.html" aria-label="删除相册（UI态）">
            <span class="button-icon" style="color: var(--text-secondary)"
              ><span class="ico ico-trash"></span
            ></span>
            删除相册（仅UI态）
          </a>

          <div style="height: 80px"></div>
        </div>

        <div class="nav-bar" role="navigation" aria-label="底部导航">
          <a class="nav-item" href="home.html" aria-label="首页">
            <span class="ico ico-home" aria-hidden="true"></span>
            <span>首页</span>
          </a>
          <a class="nav-item" href="diaries-list.html" aria-label="恋爱日记">
            <span class="ico ico-diary" aria-hidden="true"></span>
            <span>日记</span>
          </a>
          <a
            class="nav-item active"
            href="albums-list.html"
            aria-label="爱的相册"
          >
            <span class="ico ico-album" aria-hidden="true"></span>
            <span>相册</span>
          </a>
          <a class="nav-item" href="milestones-timeline.html" aria-label="相爱里程碑">
            <span class="ico ico-milestone" aria-hidden="true"></span>
            <span>里程碑</span>
          </a>
        </div>

        <!-- Preview modal -->
        <div id="albumImgPreview" class="modal" aria-label="相册图片预览弹层">
          <div class="modal-card">
            <div class="modal-media">
              <img
                src="https://images.unsplash.com/photo-1489515217757-5fd1be406fef?auto=format&fit=crop&w=900&q=70"
                alt="预览大图"
              />
            </div>
            <div class="modal-footer">
              <a class="button ghost" href="albums-detail.html" aria-label="关闭预览">
                关闭
              </a>
              <a class="button primary" href="albums-detail.html#shareSheetModal" aria-label="分享图片">
                分享
              </a>
            </div>
          </div>
        </div>

        <!-- Share sheet modal (UI mock) -->
        <div
          id="shareSheetModal"
          class="modal"
          aria-label="分享弹层"
        >
          <div class="modal-card" style="max-width: 320px">
            <div style="padding: var(--space-md)">
              <div class="row-between" style="margin-bottom: var(--space-md)">
                <div style="font-weight: 950; font-size: 18px">分享</div>
                <a class="icon-button" href="albums-detail.html" aria-label="关闭分享">
                  <span class="ico ico-close" aria-hidden="true"></span>
                </a>
              </div>
              <div class="muted" style="font-size: 13px; margin-bottom: var(--space-md)">
                选择分享方式（UI态示例）
              </div>
              <div style="display: flex; flex-direction: column; gap: var(--space-sm)">
                <a class="button ghost" href="albums-detail.html" aria-label="分享：微信">
                  <span class="button-icon"><span class="ico ico-message"></span></span>
                  微信
                </a>
                <a class="button ghost" href="albums-detail.html" aria-label="分享：微博">
                  <span class="button-icon"><span class="ico ico-at"></span></span>
                  微博
                </a>
                <a class="button ghost" href="albums-detail.html" aria-label="复制链接">
                  <span class="button-icon"><span class="ico ico-link"></span></span>
                  复制链接（兜底）
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
