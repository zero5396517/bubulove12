<ion-header translucent="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button fill="clear" (click)="milestone ? router.navigateByUrl('/milestones/detail/' + milestone.id) : null">
        <ion-icon name="arrow-back" aria-hidden="true"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>编辑里程碑</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" *ngIf="milestone">
  <ion-card>
    <ion-card-content>
      <ion-item lines="none">
        <ion-label position="stacked">名称</ion-label>
        <ion-input [(ngModel)]="title"></ion-input>
      </ion-item>

      <div class="section-label">日期类型</div>
      <ion-segment [(ngModel)]="dateType">
        <ion-segment-button value="solar">公历</ion-segment-button>
        <ion-segment-button value="lunar">农历</ion-segment-button>
      </ion-segment>

      <ion-item lines="none" class="mt-8">
        <ion-label position="stacked">日期</ion-label>
        <ion-input type="date" [(ngModel)]="date"></ion-input>
      </ion-item>

      <ion-item lines="none">
        <ion-label position="stacked">说明</ion-label>
        <ion-textarea [(ngModel)]="description" auto-grow="true"></ion-textarea>
      </ion-item>

      <div class="section-label">重要时刻</div>
      <ion-segment [value]="important ? 'yes' : 'no'" (ionChange)="important = $event.detail.value === 'yes'">
        <ion-segment-button value="yes">重要</ion-segment-button>
        <ion-segment-button value="no">普通</ion-segment-button>
      </ion-segment>

      <ion-item lines="none" class="mt-8">
        <ion-label position="stacked">提前 N 天提醒</ion-label>
        <ion-input type="number" [(ngModel)]="remindDays" min="0" max="365"></ion-input>
      </ion-item>

      <ion-button expand="block" color="primary" class="mt-16" (click)="save()">
        <ion-icon slot="start" name="checkmark-circle"></ion-icon>
        更新里程碑
      </ion-button>
      <ion-button expand="block" fill="outline" color="danger" class="mt-8" (click)="deleteMilestone()">
        <ion-icon slot="start" name="trash"></ion-icon>
        删除里程碑
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
