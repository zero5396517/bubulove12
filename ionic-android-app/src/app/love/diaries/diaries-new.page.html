<ion-header translucent="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button fill="clear" routerLink="/tabs/diaries">
        <ion-icon name="arrow-back" aria-hidden="true"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>新建日记</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>把今天写给ta</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <div class="hint">标题、内容、照片和语音都可以一起记录。</div>

      <ion-item lines="none">
        <ion-label position="stacked">日记标题</ion-label>
        <ion-input [(ngModel)]="title" placeholder="比如：我们在灯光下慢慢走"></ion-input>
      </ion-item>

      <ion-item lines="none">
        <ion-label position="stacked">日记日期</ion-label>
        <ion-input type="date" [(ngModel)]="date"></ion-input>
      </ion-item>

      <ion-item lines="none">
        <ion-label position="stacked">内容</ion-label>
        <ion-textarea [(ngModel)]="body" placeholder="写下你想记录的：心情、地点、对ta说的话……" auto-grow="true"></ion-textarea>
      </ion-item>

      <div class="section-label">隐私</div>
      <ion-segment [(ngModel)]="privacy">
        <ion-segment-button value="private">私密（仅你们可见）</ion-segment-button>
        <ion-segment-button value="public">公开</ion-segment-button>
      </ion-segment>

      <div class="section-label">添加照片（多选）</div>
      <input #fileInput type="file" accept="image/*" multiple style="display: none" (change)="onSelectPhotos($event)" />
      <ion-button expand="block" fill="outline" color="primary" (click)="fileInput.click()">
        <ion-icon slot="start" name="images-outline" aria-hidden="true"></ion-icon>
        从相册选择 / 拍照
      </ion-button>

      <div *ngIf="photoFiles.length" class="photo-grid">
        <div *ngFor="let p of photoFiles; let i = index" class="photo-tile">
          <img [src]="p.url" alt="照片预览" />
          <button class="remove-btn" (click)="removePhoto(i)" aria-label="删除照片">✕</button>
          <div class="cover-mark" *ngIf="i === 0">封面</div>
        </div>
      </div>

      <div class="section-label">语音（可选）</div>
      <div class="voice-row">
        <ion-button [color]="recording ? 'danger' : 'primary'" (click)="toggleRecording()">
          <ion-icon slot="start" [name]="recording ? 'stop' : 'mic'" aria-hidden="true"></ion-icon>
          {{ recording ? '停止录制' : '录制语音' }}
        </ion-button>
        <div class="voice-hint" *ngIf="!voiceUrl">若设备不支持录音，页面将保持 UI 态</div>
      </div>
      <audio *ngIf="voiceUrl" [src]="voiceUrl" controls class="audio"></audio>

      <ion-button expand="block" color="primary" class="mt-16" (click)="save()">
        <ion-icon slot="start" name="checkmark-circle" aria-hidden="true"></ion-icon>
        保存并预览
      </ion-button>
      <ion-button expand="block" fill="outline" class="mt-8" routerLink="/tabs/diaries">取消</ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
